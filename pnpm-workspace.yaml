  "@types/node": ^26.6.4
  astro: ^7.3.5
  "@astrojs/react": ^7.0.0
  "@astrojs/check": ^0.9.10
  "@astrojs/ts-plugin": ^1.10.12
  react: ^19.3.0
  react-dom: ^19.3.0
  husky: ^9.1.7
  lint-staged: ^17.6.0
  "eslint-config-narwhal": ^2.1.1
overrides:
  react: "catalog:"
  react-dom: "catalog:"
allowBuilds:
  esbuild: true
  sharp: true
  workerd: true
minimumReleaseAgeExclude:
