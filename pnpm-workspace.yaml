packages:
  - "packages/*"
  - "apps/*"
catalogMode: strict
catalogPrune: true
catalog:
  typescript: ^6.0.3
  "@types/node": ^26.6.4
  astro: ^7.3.5
  "@astrojs/react": ^7.0.0
  "@astrojs/check": ^0.9.10
  "@astrojs/ts-plugin": ^1.10.12
  react: ^19.3.0
  react-dom: ^19.3.0
  husky: ^9.1.7
  lint-staged: ^17.6.0
overrides:
  react: "catalog:"
  react-dom: "catalog:"
allowBuilds:
  esbuild: true
  sharp: true
  workerd: true
minimumReleaseAgeExclude:
  - "@cloudflare/workerd-darwin-64@1.20260930.2 || 1.20261001.1"
  - "@cloudflare/workerd-darwin-arm64@1.20260930.2 || 1.20261001.1"
  - "@cloudflare/workerd-linux-64@1.20260930.2 || 1.20261001.1"
  - "@cloudflare/workerd-linux-arm64@1.20260930.2 || 1.20261001.1"
  - "@cloudflare/workerd-windows-64@1.20260930.2 || 1.20261001.1"
  - "miniflare@5.20261001.0-alpha"
  - "workerd@1.20260930.2 || 1.20261001.1"
  - wrangler@4.145.0 || 4.146.0 || 4.147.0
  - "@stripe/react-stripe-js@7.0.0"
  - "@stripe/stripe-js@10.0.0"
  - "stripe@23.0.0"
  - eslint@10.12.0
