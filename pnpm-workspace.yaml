  - "@cloudflare/workerd-darwin-arm64@1.20260930.2 || 1.20261001.1"
  - "@cloudflare/workerd-linux-64@1.20260930.2 || 1.20261001.1"
  - "@cloudflare/workerd-linux-arm64@1.20260930.2 || 1.20261001.1"
  - "@cloudflare/workerd-windows-64@1.20260930.2 || 1.20261001.1"
  - "miniflare@5.20261001.0-alpha"
  - "workerd@1.20260930.2 || 1.20261001.1"
  - wrangler@4.145.0 || 4.146.0 || 4.147.0
  - "@stripe/react-stripe-js@7.0.0"
  - "@stripe/stripe-js@10.0.0"
  - "stripe@23.0.0"
  - eslint@10.12.0
  - eslint-config-narwhal@1.0.2 || 2.1.0 || 2.1.1
  - eslint-plugin-unicorn@77.0.0
  - "@typescript-eslint/eslint-plugin@8.71.1"
